<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="gh-viewer">
  <!-- Self-coloured, unlike icons/icon.svg which uses context-fill: this one is
       rendered outside Firefox's UI (AMO listing, about:addons), where
       context-fill does not resolve and the icon would come out invisible.
       Three rows rather than four - at 48px anything denser turns to mush. -->
  <rect width="96" height="96" rx="20" fill="#1f2328"/>
  <!-- the page you are working in, dimmed and pushed aside -->
  <rect x="13" y="21" width="26" height="54" rx="5" fill="#ffffff" opacity="0.14"/>
  <!-- the sidebar, carrying rows of work -->
  <rect x="45" y="21" width="38" height="54" rx="5" fill="#f6f8fa"/>
  <g>
    <circle cx="54" cy="34" r="4.5" fill="#1a7f37"/>
    <rect x="62" y="31" width="15" height="6" rx="3" fill="#59636e"/>
    <circle cx="54" cy="48" r="4.5" fill="#cf222e"/>
    <rect x="62" y="45" width="15" height="6" rx="3" fill="#59636e"/>
    <circle cx="54" cy="62" r="4.5" fill="#9a6700"/>
    <rect x="62" y="59" width="11" height="6" rx="3" fill="#59636e"/>
  </g>
</svg>
