name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catches newly-published query/advisory coverage against unchanged code -
    # the push/PR triggers only re-scan what a commit touches.
    - cron: "17 3 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # extension/, chrome/, tools/ and tests/ cover both languages in the repo.
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
